name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302

      - name: Restore
        run: dotnet restore NetworkAVAmp.Controller.sln

      - name: Build
        run: dotnet build NetworkAVAmp.Controller.sln -c Release --no-restore

      - name: Test
        run: dotnet test NetworkAVAmp.Controller.sln -c Release --no-build --no-restore

      - name: Verify formatting
        run: dotnet format NetworkAVAmp.Controller.sln --verify-no-changes --no-restore

      - name: Package portable distribution
        shell: pwsh
        run: ./build/Build-Distributions.ps1 -SkipInstaller

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: nava-win-x64-portable
          path: |
            artifacts/distribution/*.zip
            artifacts/distribution/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download portable artifact
        uses: actions/download-artifact@v4
        with:
          name: nava-win-x64-portable
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
